<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surf &amp; Skate Shop — Catálogo</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./src/css/theme.css" />
  <link rel="stylesheet" href="./src/css/style.css" />
</head>
<body>
  <header id="navbar-container"></header>

  <main class="container py-4">
    <section class="hero mb-4">
      <h1 class="fw-bold">Surf &amp; Skate Shop</h1>
      <p class="text-muted">Tablas, ropa, calzado y accesorios para surf y skate.</p>
    </section>

    <section class="filters-bar row g-3 mb-4" aria-label="Filtros del catálogo">
      <div class="col-md-5">
        <input
          type="search"
          id="search-input"
          class="form-control"
          placeholder="Buscar por nombre o marca..."
        />
      </div>
      <div class="col-md-4">
        <select id="sport-filter" class="form-select">
          <option value="">Todas las categorías / deportes</option>
          <option value="Surf">Surf</option>
          <option value="Skate">Skate</option>
          <option value="Calzado">Calzado</option>
          <option value="Ropa">Ropa</option>
        </select>
      </div>
      <div class="col-md-3">
        <input
          type="number"
          id="max-price-filter"
          class="form-control"
          placeholder="Precio máximo ($)"
          min="0"
        />
      </div>
    </section>

    <section id="catalog-grid" class="product-grid"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./src/js/navbar.js"></script>
  <script type="module" src="./src/js/catalog.js"></script>
</body>
</html>

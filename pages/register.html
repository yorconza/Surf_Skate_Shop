<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro — Surf &amp; Skate Shop</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/css/login.css" />
  
</head>
<body class="bg-light">

  <main class="container-fluid p-0">
    <div class="row g-0 vh-100">
      
      <!-- LADO IZQUIERDO: Formulario de Registro -->
      <div class="col-md-6 d-flex flex-column bg-white position-relative">
        
        <!-- Cabecera -->
        <div class="d-flex justify-content-start align-items-center p-4 mt-2">
          <a href="./login.html" class="text-muted text-decoration-none font-inter fs-6">Back</a>
        </div>

        <!-- Contenedor Central del Formulario -->
        <div class="flex-grow-1 d-flex align-items-center justify-content-center px-4 pb-4">
          <div class="w-100" style="max-width: 400px;">
            
            <h1 class="font-playfair display-5 mb-4 text-dark">New Rider</h1>

            <form id="register-form">
              <!-- Nombre -->
              <div class="mb-3">
                <input type="text" id="reg-name" class="form-control custom-input" placeholder="Full Name" required />
              </div>

              <!-- Email -->
              <div class="mb-3">
                <input type="email" id="reg-email" class="form-control custom-input" placeholder="Email" required />
              </div>

              <!-- Password -->
              <div class="mb-3 position-relative">
                <input type="password" id="reg-password" class="form-control custom-input pe-5" placeholder="Password" minlength="6" required />
                <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y text-muted border-0 shadow-none">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                    <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                    <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                  </svg>
                </button>
              </div>

              <!-- Dirección -->
              <div class="mb-4">
                <input type="text" id="reg-address" class="form-control custom-input" placeholder="Delivery Address" required />
              </div>

              <!-- Botón Registrarse -->
              <button type="submit" class="btn btn-dark w-100 py-2 mb-4 custom-btn">Sign Up</button>

              <!-- Separador -->
              <div class="text-center text-muted font-inter small mb-3">
                or register with
              </div>

              <!-- Botón Google -->
              <button type="button" id="btn-google-register" class="btn btn-outline-secondary w-100 py-2 custom-btn-outline d-flex align-items-center justify-content-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px" height="18px">
                  <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                  <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                  <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                  <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Register with Google
              </button>
            </form>

            <!-- Link a Login -->
            <p class="text-center mt-4 font-inter small text-muted">
              Already have an account? <a href="./login.html" class="text-dark fw-bold text-decoration-none">Login</a>
            </p>
            
            <p id="register-message" class="mt-2 text-center text-danger small"></p>
          </div>
        </div>
      </div>

      <!-- LADO DERECHO: Imagen con overlay -->
      <div class="col-md-6 d-none d-md-flex right-panel-register position-relative">
        <!-- Capa de degradado inferior -->
        <div class="overlay-gradient"></div>
        
        <!-- Textos superpuestos -->
        <div class="position-relative w-100 h-100 d-flex flex-column justify-content-between p-4 text-white z-1">
          
          <div class="font-inter small">
            <span>New Member</span>
          </div>
          
          <div class="px-4">
            <h2 class="font-inter fw-normal mb-5" style="font-size: 1.8rem; max-width: 300px; line-height: 1.4;">
              Join the community and ride the wave
            </h2>
            <p class="font-inter small ms-auto" style="max-width: 200px;">
              Get access to exclusive drops and surf gear.
            </p>
          </div>
          
          <div class="font-inter small">
            <span>2026</span>
          </div>
          
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

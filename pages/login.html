<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión — Surf &amp; Skate Shop</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../src/css/theme.css" />
  <link rel="stylesheet" href="../src/css/style.css" />
</head>
<body>
  <header id="navbar-container"></header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <h1 class="h3 mb-3">Iniciar sesión</h1>

        <form id="login-form" class="card p-4">
          <div class="mb-2">
            <label for="login-email" class="form-label">Correo electrónico</label>
            <input type="email" id="login-email" class="form-control" required />
          </div>

          <div class="mb-3">
            <label for="login-password" class="form-label">Contraseña</label>
            <input type="password" id="login-password" class="form-control" required />
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-2">Ingresar</button>
          <button type="button" id="btn-google-login" class="btn btn-outline-dark w-100">
            Continuar con Google
          </button>
        </form>

        <p id="login-message" class="mt-2"></p>
        <p class="text-center mt-2">
          ¿No tienes cuenta? <a href="./register.html">Regístrate aquí</a>
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../src/js/navbar.js"></script>
</body>
</html>

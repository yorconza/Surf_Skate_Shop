<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Perfil — Surf &amp; Skate Shop</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../src/css/theme.css" />
  <link rel="stylesheet" href="../src/css/style.css" />
</head>
<body>
  <header id="navbar-container"></header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <h1 class="h3 mb-3">Perfil de usuario</h1>

        <section class="card p-4">
          <div class="d-flex align-items-center gap-3 mb-3">
            <img
              id="profile-avatar"
              src="https://placehold.co/120x120?text=Avatar"
              alt="Foto de perfil"
            />
            <div>
              <p class="mb-1"><strong>Correo:</strong> <span id="profile-email">-</span></p>
              <span class="badge bg-primary" id="profile-role">Cliente</span>
            </div>
          </div>

          <form id="profile-form">
            <div class="mb-2">
              <label for="profile-name" class="form-label">Nombre completo</label>
              <input type="text" id="profile-name" class="form-control" required />
            </div>

            <div class="mb-2">
              <label for="profile-address" class="form-label">Dirección de entrega</label>
              <input type="text" id="profile-address" class="form-control" required />
            </div>

            <div class="mb-3">
              <label for="profile-photo" class="form-label">Foto de perfil (Firebase Storage)</label>
              <input type="file" id="profile-photo" class="form-control" accept="image/*" />
            </div>

            <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
          </form>
        </section>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../src/js/navbar.js"></script>
</body>
</html>
